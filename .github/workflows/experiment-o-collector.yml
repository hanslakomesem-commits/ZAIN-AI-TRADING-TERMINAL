
name: Experiment O - Scheduled Market Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-o-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secret
        shell: bash
        env:
          SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: |
          if [ -z "$SERVICE_ROLE_JWT" ]; then
            echo "::error::Secret belum diatur."
            exit 1
          fi

      - name: Collect Binance Futures market snapshot
        shell: bash
        env:
          SUPABASE_URL: https://pxseiytikiulxincoolh.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_KA2AwEzwuepbHm2yu95IkA_eUBb2sXK
          SERVICE_ROLE_JWT: ${{ secrets.SUPABASE_SERVICE_ROLE_JWT }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 90 \
            -X POST "$SUPABASE_URL/functions/v1/zain-experiment-o" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_JWT" \
            --data '{"action":"collect"}'
